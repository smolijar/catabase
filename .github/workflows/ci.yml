name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Check release versions
        run: python3 scripts/check-release-version.py
      - name: Test release checks
        run: python3 -B -m unittest discover -s scripts/tests
      - name: Check Svelte and TypeScript
        run: pnpm --dir ui run check
      - name: Test frontend
        run: node --experimental-strip-types --test ui/tests/*.test.ts
      - name: Build frontend
        run: pnpm --dir ui run build

  rust:
    name: Rust checks (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: checks
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust (no external services)
        run: cargo test --locked --workspace

  macos:
    name: macOS preview (Apple Silicon + Intel)
    # PRs get the checks above; main/manual builds also produce downloadable apps.
    # The release workflow calls these checks on a tag and builds its own signed app.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    needs: [frontend, rust]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.1'
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: universal-preview
      - name: Build app and disk image
        # Ad-hoc signing needs no credentials. This is not a notarized release.
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Archive and verify universal app
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          lipo -verify_arch arm64 x86_64 "$bundle/macos/Catabase.app/Contents/MacOS/catabase"
          codesign --verify --deep --strict "$bundle/macos/Catabase.app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/Catabase.app" artifacts/Catabase-macos-universal-preview.app.zip
          cp "$bundle"/dmg/*.dmg artifacts/
          cd artifacts
          shasum -a 256 ./*.zip ./*.dmg > SHA256SUMS
      - name: Upload preview packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Catabase-macos-universal-preview-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Describe preview
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### macOS preview
          Download the workflow artifact for a universal app (Apple Silicon and Intel), DMG, and SHA-256 checksums.
          This build is ad-hoc signed, not Developer ID signed or notarized. macOS may block it.
          It does not create a GitHub Release or an automatic-update feed.
          EOF
