name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Check release versions
        run: python3 scripts/check-release-version.py
      - name: Test release checks
        run: python3 -B -m unittest discover -s scripts/tests
      - name: Check Svelte and TypeScript
        run: pnpm --dir ui run check
      - name: Test frontend
        run: node --experimental-strip-types --test ui/tests/*.test.ts
      - name: Build frontend
        run: pnpm --dir ui run build

  rust:
    name: Rust checks (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.96.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: checks
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test Rust (no external services)
        run: cargo test --locked --workspace
